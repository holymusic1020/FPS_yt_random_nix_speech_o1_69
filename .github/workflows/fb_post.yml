name: FB Poster

on:
  schedule:
    # Every 2 hours at :45 — catches new YT uploads shortly after they post
    - cron: "45 */2 * * *"
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: fb-poster
  cancel-in-progress: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPACE_URL: ${{ secrets.SPACE_URL }}
      XP_KEY: ${{ secrets.XP_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Run FB poster
        run: python3 poster.py
