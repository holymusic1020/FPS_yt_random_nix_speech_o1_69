name: FB Poster

on:
  schedule:
    # Aligned to the Space's upload windows (all UTC):
    #   Shorts post 06:00 & 12:00 + random 0-2h delay  -> video usually in vault by ~08:15 / ~14:15
    #   Long video posts 18:00 (every 2 days) + 1-3h delay -> in vault by ~21:30
    # Margin runs catch everything: 09:15 / 15:15 / 22:15 UTC.
    # (The "already crossposted" check makes extra runs harmless no-ops.)
    - cron: "15 9,15,22 * * *"
  workflow_dispatch:   # manual run anytime from the Actions tab

permissions:
  contents: read

concurrency:
  group: fb-poster
  cancel-in-progress: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPACE_URL: ${{ secrets.SPACE_URL }}
      XP_KEY: ${{ secrets.XP_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Run FB poster
        run: python3 poster.py
